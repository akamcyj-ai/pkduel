<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>승부차기 대결</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script>
(function(){var srcs=['peerjs.min.js','https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
function load(i){if(i>=srcs.length||window.Peer)return;var sc=document.createElement('script');sc.src=srcs[i];sc.onerror=function(){load(i+1)};sc.onload=function(){if(!window.Peer)load(i+1)};document.head.appendChild(sc)}load(0)})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1f14;--panel:#12301f;--line:#1f4a31;--acc:#ffd43b;--txt:#f1f5f0;--mut:#9fbfa9;--red:#ff6b6b;--grn:#51cf66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',system-ui,sans-serif;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:12px 12px 24px}
h1,h2,.disp{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400;letter-spacing:.5px}
h1{font-size:40px;margin:18px 0 4px;text-align:center;color:var(--acc);text-shadow:0 3px 0 #a07a00}
h2{font-size:20px;margin:18px 0 8px}
.sub{text-align:center;color:var(--mut);margin:0 0 18px;font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:900;font-family:inherit;background:var(--acc);color:#2b2200;box-shadow:0 4px 0 #a07a00;margin:10px 0;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a07a00}
.btn.sec{background:#2b5a3f;color:var(--txt);box-shadow:0 4px 0 #173524}
.btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 #a33}
.btn:disabled{opacity:.4}
.btn.small{padding:10px;font-size:15px}
input.tx{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:#0e2618;color:var(--txt);font-size:18px;font-family:inherit;text-align:center}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px}.row>*{flex:1}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:12px;border-radius:12px;border:2px solid var(--line);background:#0e2618;color:var(--txt);font-size:16px;font-weight:900;font-family:inherit}
.seg button.on{border-color:var(--acc);background:#3a3410;color:var(--acc)}
.cards{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.card{flex:0 0 118px;scroll-snap-align:start;background:#0e2618;border:2px solid var(--line);border-radius:14px;padding:6px 6px 8px;text-align:center;cursor:pointer}
.card.sel{border-color:var(--acc);background:#2c2a10;box-shadow:0 0 0 2px #ffd43b55}
.card svg{width:84px;height:100px;display:block;margin:0 auto}
.card b{display:block;font-size:13px;line-height:1.2;margin-top:2px}
.card small{display:block;color:var(--mut);font-size:11px;margin-bottom:4px}
.st{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--mut);margin-top:2px}
.st i{flex:1;height:5px;background:#24402f;border-radius:3px;overflow:hidden;position:relative}
.st i::after{content:'';position:absolute;inset:0;width:var(--w);background:var(--acc)}
.code{font-family:'Black Han Sans';font-size:56px;letter-spacing:10px;text-align:center;color:var(--acc);margin:4px 0}
.note{font-size:13px;color:var(--mut);line-height:1.5}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:#24402f;font-size:12px;font-weight:700}
.pill.ok{background:#1f6b35;color:#d3f9d8}
/* play */
.board{background:#071a10;border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.prow{display:flex;align-items:center;gap:8px;padding:4px 0}
.prow svg{width:34px;height:40px;flex:0 0 34px}
.prow .nm{flex:0 0 74px;font-weight:900;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.prow .sc{font-family:'Black Han Sans';font-size:26px;width:30px;text-align:center;color:var(--acc)}
.dots{flex:1;display:flex;flex-wrap:wrap;gap:4px}
.dot{width:15px;height:15px;border-radius:50%;background:#24402f;font-size:10px;display:flex;align-items:center;justify-content:center}
.dot.g{background:var(--grn)}.dot.x{background:var(--red)}
.dot.g::after{content:'⚽';font-size:9px}.dot.x::after{content:'✕';color:#fff;font-weight:900}
#turnlbl{text-align:center;font-size:14px;margin:8px 0 4px;color:var(--mut)}
#turnlbl b{color:var(--txt)}
.scenewrap{position:relative;border-radius:14px;overflow:hidden;border:2px solid #0006}
#scene{display:block;width:100%;height:auto;touch-action:none;user-select:none}
#panel{min-height:150px;margin-top:10px}
.hint{text-align:center;font-weight:700;font-size:15px;margin:4px 0 8px}
.meter{position:relative;height:30px;border-radius:15px;background:linear-gradient(90deg,#3b5bdb,#4dabf7 40%,#ffd43b 70%,#ff6b6b);border:3px solid #0008;overflow:hidden}
.meter .sweet{position:absolute;top:0;bottom:0;background:rgba(81,207,102,.85);border-left:2px solid #fff;border-right:2px solid #fff}
.meter .mk{position:absolute;top:-3px;bottom:-3px;width:6px;margin-left:-3px;background:#fff;box-shadow:0 0 6px #000}
.mlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:3px}
.timer{text-align:center;font-family:'Black Han Sans';font-size:22px;color:var(--acc)}
.timer.low{color:var(--red)}
.wait{text-align:center;padding:24px 0;font-size:16px;color:var(--mut)}
.ovl{position:fixed;inset:0;background:rgba(5,15,10,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:24px;text-align:center}
.ovl .big{font-family:'Black Han Sans';font-size:34px;color:var(--acc);margin:12px 0}
.ovl svg{width:120px;height:144px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:99px;font-weight:900;z-index:30;pointer-events:none;animation:tf 1.6s forwards}
@keyframes tf{0%{opacity:0;transform:translate(-50%,-10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.res{text-align:center}
.res .big{font-family:'Black Han Sans';font-size:44px;color:var(--acc);margin:10px 0}
.res svg.av{width:150px;height:180px}
.conn{font-size:11px;text-align:right;color:var(--mut);margin-bottom:4px}
.conn.off{color:var(--red)}
.how li{margin:4px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ================= 데이터 ================= */
const KICKERS=[
 {id:'dash',name:'번개 대시',tag:'스피드 슈터',skin:'#8d5a3b',hair:'buzz',hc:'#151515',jersey:'#1c3fbf',num:'11',nc:'#fff',band:'#ffffff',mouth:'smirk',brow:2,pw:8,ac:7,cp:7},
 {id:'pipo',name:'마법사 피포',tag:'정확도 최강',skin:'#f1c9a5',hair:'curly',hc:'#6b3d1c',jersey:'#2f9e44',num:'8',nc:'#fff',mouth:'smile',brow:-1,pw:6,ac:10,cp:8},
 {id:'roco',name:'로켓 로코',tag:'대포알 슛',skin:'#d9a47c',hair:'spiky',hc:'#2b1a0e',jersey:'#e03131',num:'9',nc:'#fff',mouth:'grin',brow:3,pw:10,ac:6,cp:6},
 {id:'haru',name:'미소 캡틴 하루',tag:'만능 올라운더',skin:'#f0c8a0',hair:'side',hc:'#1a1a1a',jersey:'#7048e8',num:'14',nc:'#fff',mouth:'grin',brow:0,pw:8,ac:8,cp:8},
 {id:'tank',name:'대포 탱크',tag:'힘이 장사',skin:'#c68642',hair:'bald',hc:'#2a1a10',jersey:'#212529',num:'4',nc:'#ffd43b',beard:1,mouth:'smirk',brow:3,pw:10,ac:5,cp:8},
 {id:'fox',name:'여우 키드',tag:'강심장 테크니션',skin:'#f6d5b5',hair:'mohawk',hc:'#f76707',jersey:'#fd7e14',num:'17',nc:'#222',mouth:'smirk',brow:1,pw:7,ac:8,cp:10},
 {id:'leo',name:'사자 레오',tag:'카리스마 리더',skin:'#e8b48a',hair:'long',hc:'#e0a100',jersey:'#0c8599',num:'5',nc:'#fff',mouth:'smile',brow:2,pw:9,ac:7,cp:9},
];
const KEEPERS=[
 {id:'moon',name:'거미손 문',tag:'반사신경 장인',skin:'#f0c8a0',hair:'buzz',hc:'#111',jersey:'#2b8a3e',num:'1',nc:'#fff',gl:'#ffd43b',mouth:'smile',brow:1,rf:9,jp:7},
 {id:'rock',name:'바위벽 로키',tag:'든든한 덩치',skin:'#8d5a3b',hair:'bald',hc:'#1a1a1a',jersey:'#495057',num:'13',nc:'#fff',gl:'#ff922b',beard:1,mouth:'smirk',brow:3,rf:8,jp:6},
 {id:'cat',name:'점프캣 냥',tag:'구석까지 점프',skin:'#f6d5b5',hair:'spiky',hc:'#adb5bd',jersey:'#e64980',num:'23',nc:'#fff',gl:'#74c0fc',mouth:'grin',brow:-1,rf:7,jp:10},
 {id:'octo',name:'문어팔 옥토',tag:'팔이 길어요',skin:'#d9a47c',hair:'curly',hc:'#5f3dc4',jersey:'#fab005',num:'12',nc:'#222',gl:'#e03131',mouth:'smile',brow:0,rf:10,jp:6},
 {id:'wall',name:'철벽 대장',tag:'빈틈 없음',skin:'#e8b48a',hair:'side',hc:'#3b2412',jersey:'#1971c2',num:'21',nc:'#fff',gl:'#69db7c',band:'#ff6b6b',mouth:'smirk',brow:2,rf:8,jp:8},
];
const KMAP=Object.fromEntries(KICKERS.map(c=>[c.id,c])), GMAP=Object.fromEntries(KEEPERS.map(c=>[c.id,c]));
const TURN_MS=15000;
/* 골대 좌표: u 0..1 (왼→오), v 0..1 (바닥→크로스바) */
const GX=40,GW=280,GY=200,GH=110,SPOT={x:180,y:392},HAND=72;
const toScr=(u,v)=>({x:GX+u*GW,y:GY-v*GH});
const toGoal=(x,y)=>({u:(x-GX)/GW,v:(GY-y)/GH});
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const r3=x=>Math.round(x*1000)/1000;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

/* ================= 캐리커처 ================= */
function avatar(c){
 const sk=c.skin,hc=c.hc;let back='',hair='';
 const cap='M20 48 Q18 14 50 13 Q82 14 80 48 Q74 30 50 27 Q26 30 20 48Z';
 switch(c.hair){
  case 'spiky':hair=`<path d="M20 47 L16 22 L30 28 L30 6 L42 21 L50 2 L58 21 L70 6 L70 28 L84 22 L80 47 Q74 30 50 27 Q26 30 20 47Z" fill="${hc}"/>`;break;
  case 'curly':{let s=`<path d="${cap}" fill="${hc}"/>`;for(let i=0;i<9;i++){const a=Math.PI*(1.0+i*0.125);s+=`<circle cx="${(50+29*Math.cos(a)).toFixed(1)}" cy="${(44+27*Math.sin(a)).toFixed(1)}" r="10" fill="${hc}"/>`}hair=s;break}
  case 'side':hair=`<path d="M19 50 Q15 11 52 11 Q85 13 81 47 Q78 33 66 29 Q48 35 27 30 Q22 38 19 50Z" fill="${hc}"/><path d="M28 28 Q50 10 78 26 Q62 20 44 32Z" fill="${hc}"/>`;break;
  case 'buzz':hair=`<path d="${cap}" fill="${hc}" opacity=".85"/>`;break;
  case 'bald':hair=`<ellipse cx="39" cy="25" rx="9" ry="5" fill="#fff" opacity=".35"/>`;break;
  case 'mohawk':hair=`<path d="${cap}" fill="${hc}" opacity=".3"/><path d="M42 30 Q38 0 50 -4 Q62 0 58 30Z" fill="${hc}"/>`;break;
  case 'long':back=`<path d="M17 52 Q12 8 50 8 Q88 8 83 52 L88 96 L70 90 L72 52 L28 52 L30 90 L12 96Z" fill="${hc}"/>`;hair=`<path d="M20 47 Q20 11 50 11 Q80 11 80 47 Q72 26 55 24 Q40 36 20 47Z" fill="${hc}"/>`;break;
 }
 const b=c.brow||0;
 const mouth=c.mouth==='grin'?`<path d="M36 62 Q50 78 64 62Z" fill="#fff" stroke="#5a2a1a" stroke-width="2.2" stroke-linejoin="round"/>`
  :c.mouth==='smirk'?`<path d="M38 65 Q51 70 63 60" fill="none" stroke="#5a2a1a" stroke-width="3" stroke-linecap="round"/>`
  :`<path d="M38 63 Q50 72 62 63" fill="none" stroke="#5a2a1a" stroke-width="3" stroke-linecap="round"/>`;
 return `<g>${back}
 <path d="M10 122 Q12 90 50 86 Q88 90 90 122Z" fill="${c.jersey}"/>
 <path d="M40 87 L50 97 L60 87" fill="none" stroke="${c.nc}" stroke-width="3"/>
 <text x="50" y="117" text-anchor="middle" font-size="19" font-weight="900" fill="${c.nc}" font-family="Arial,sans-serif">${c.num}</text>
 <rect x="43" y="72" width="14" height="16" fill="${sk}"/>
 <circle cx="20" cy="50" r="6.5" fill="${sk}"/><circle cx="80" cy="50" r="6.5" fill="${sk}"/>
 <ellipse cx="50" cy="48" rx="30" ry="32" fill="${sk}"/>
 ${hair}
 ${c.band?`<rect x="20" y="29" width="60" height="7" rx="3" fill="${c.band}"/>`:''}
 ${c.beard?`<path d="M23 54 Q26 86 50 86 Q74 86 77 54 Q72 72 50 72 Q28 72 23 54Z" fill="${hc}" opacity=".85"/>`:''}
 <ellipse cx="38" cy="47" rx="7.5" ry="8.5" fill="#fff"/><ellipse cx="62" cy="47" rx="7.5" ry="8.5" fill="#fff"/>
 <circle cx="39" cy="48" r="4.2" fill="#222"/><circle cx="61" cy="48" r="4.2" fill="#222"/>
 <circle cx="40.6" cy="46.4" r="1.4" fill="#fff"/><circle cx="62.6" cy="46.4" r="1.4" fill="#fff"/>
 <path d="M29 ${37-b} L45 ${37+b}" stroke="${c.hair==='bald'?'#3a2618':hc}" stroke-width="3.6" stroke-linecap="round"/>
 <path d="M71 ${37-b} L55 ${37+b}" stroke="${c.hair==='bald'?'#3a2618':hc}" stroke-width="3.6" stroke-linecap="round"/>
 <path d="M50 50 Q45 58 51 59" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="2.2" stroke-linecap="round"/>
 <circle cx="30" cy="60" r="4.5" fill="#ff7b7b" opacity=".3"/><circle cx="70" cy="60" r="4.5" fill="#ff7b7b" opacity=".3"/>
 ${mouth}</g>`;
}
const avSVG=(c,cls='')=>`<svg class="${cls}" viewBox="0 -6 100 128">${avatar(c)}</svg>`;
function keeperFig(c){
 return `<g>
 <rect x="-11" y="-36" width="9" height="34" rx="3" fill="#222"/><rect x="2" y="-36" width="9" height="34" rx="3" fill="#222"/>
 <ellipse cx="-6" cy="-1" rx="7" ry="3.5" fill="#111"/><ellipse cx="7" cy="-1" rx="7" ry="3.5" fill="#111"/>
 <path d="M-12 -46 L-30 -66" stroke="${c.jersey}" stroke-width="8" stroke-linecap="round"/>
 <path d="M12 -46 L30 -66" stroke="${c.jersey}" stroke-width="8" stroke-linecap="round"/>
 <circle cx="-32" cy="-69" r="7" fill="${c.gl}" stroke="#0004"/><circle cx="32" cy="-69" r="7" fill="${c.gl}" stroke="#0004"/>
 <g transform="translate(-21 -87) scale(.42)">${avatar(c)}</g></g>`;
}
function kickerBack(c){
 const hairBack=c.hair==='bald'?'':c.hair==='long'
  ?`<path d="M-17 -122 Q-17 -138 0 -138 Q17 -138 17 -122 L19 -92 L-19 -92Z" fill="${c.hc}"/>`
  :`<path d="M-16.5 -120 Q-16 -136 0 -136 Q16 -136 16.5 -120 Q14 -108 0 -106 Q-14 -108 -16.5 -120Z" fill="${c.hc}"/>`;
 return `<g>
 <rect x="-17" y="-52" width="13" height="40" rx="5" fill="${c.skin}"/><rect x="4" y="-52" width="13" height="40" rx="5" fill="${c.skin}"/>
 <rect x="-17" y="-24" width="13" height="20" rx="3" fill="${c.jersey}"/><rect x="4" y="-24" width="13" height="20" rx="3" fill="${c.jersey}"/>
 <ellipse cx="-10" cy="-3" rx="9" ry="4" fill="#111"/><ellipse cx="11" cy="-3" rx="9" ry="4" fill="#111"/>
 <path d="M-21 -60 L21 -60 L19 -44 L-19 -44Z" fill="#f8f9fa"/>
 <path d="M-24 -66 L-30 -96" stroke="${c.skin}" stroke-width="9" stroke-linecap="round" transform="rotate(-12 -24 -96)"/>
 <path d="M24 -66 L30 -96" stroke="${c.skin}" stroke-width="9" stroke-linecap="round" transform="rotate(12 24 -96)"/>
 <path d="M-25 -102 Q0 -110 25 -102 L22 -58 L-22 -58Z" fill="${c.jersey}"/>
 <text x="0" y="-70" text-anchor="middle" font-size="22" font-weight="900" fill="${c.nc}" font-family="Arial,sans-serif">${c.num}</text>
 <rect x="-6" y="-110" width="12" height="10" fill="${c.skin}"/>
 <circle cx="0" cy="-122" r="16" fill="${c.skin}"/>${hairBack}
 ${c.band?`<rect x="-16.5" y="-128" width="33" height="5" fill="${c.band}"/>`:''}</g>`;
}
function stats(c,kind){
 const L=kind==='k'?[['파워',c.pw],['정확',c.ac],['침착',c.cp]]:[['반응',c.rf],['점프',c.jp]];
 return L.map(([n,v])=>`<div class="st">${n}<i style="--w:${v*10}%"></i></div>`).join('');
}
function picker(who,kind,sel){
 const list=kind==='k'?KICKERS:KEEPERS;
 return `<div class="cards">${list.map(c=>`<div class="card ${c.id===sel?'sel':''}" data-a="pick" data-who="${who}" data-kind="${kind}" data-id="${c.id}">${avSVG(c)}<b>${esc(c.name)}</b><small>${esc(c.tag)}</small>${stats(c,kind)}</div>`).join('')}</div>`;
}

/* ================= 사운드 ================= */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,d,type='sine',vol=.2,f2){const a=AC;if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function noise(d,vol){const a=AC;if(!a)return;try{const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.frequency.value=900;f.Q.value=.6;g.gain.value=vol;s.buffer=b;s.connect(f).connect(g).connect(a.destination);s.start()}catch(e){}}
const sfx={kick(){tone(140,.15,'sine',.6,50)},goal(){noise(1.6,.5);tone(523,.15,'triangle',.15);setTimeout(()=>tone(659,.15,'triangle',.15),130);setTimeout(()=>tone(784,.3,'triangle',.15),260)},save(){tone(200,.2,'square',.12,90);noise(.4,.2)},miss(){tone(300,.5,'sawtooth',.08,120)},whistle(){tone(2300,.35,'square',.05,2100)}};
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ================= 게임 엔진 (양쪽에서 동일하게 계산) ================= */
const turnInfo=t=>({ki:t%2,gi:1-t%2,k:Math.floor(t/2)});
function reachPx(kp,v,s){let r=24+kp.rf*2.8;if(v>0.62)r+=(kp.jp-7)*4;return r*(1.32-0.5*s)}
function resolve(kk,dd,kp){
 const [u,v,s]=kk,[du,dv]=dd;
 if(u<0||u>1||v>1){const post=(u>=-0.03&&u<0)||(u>1&&u<=1.03)||(v>1&&v<=1.04&&u>=0&&u<=1);return {type:post?'post':'miss'}}
 const b=toScr(u,v),h=toScr(du,dv);
 const d=Math.hypot(b.x-h.x,b.y-h.y);
 return {type:d<reachPx(kp,v,s)?'save':'goal'};
}
function resultOf(G,t){const {ki,gi,k}=turnInfo(t);const kk=G.p[ki].kicks[k],dd=G.p[gi].dives[k];if(!kk||!dd)return null;return resolve(kk,dd,GMAP[G.p[gi].keeper]||KEEPERS[0])}
function tally(G,n){const g=[0,0],tk=[0,0],marks=[[],[]];for(let t=0;t<n;t++){const r=resultOf(G,t);if(!r)break;const ki=t%2;tk[ki]++;const ok=r.type==='goal';if(ok)g[ki]++;marks[ki].push(ok?1:0)}return {g,tk,marks}}
function overCheck(G,n){
 const {g,tk}=tally(G,n),N=G.kicks;
 if(tk[0]<=N&&tk[1]<=N){if(g[0]+(N-tk[0])<g[1])return {over:true,w:1};if(g[1]+(N-tk[1])<g[0])return {over:true,w:0}}
 if(tk[0]>=N&&tk[1]>=N&&tk[0]===tk[1]){if(g[0]!==g[1])return {over:true,w:g[0]>g[1]?0:1};if(tk[0]>=N+10)return {over:true,w:-1}}
 return {over:false};
}
function computeKick(c,au,av,p){
 const sw=0.08+c.cp*0.012,lo=0.75-sw/2,hi=0.75+sw/2;
 let sig=0.012+(10-c.ac)*0.011,s,dv=0,label;
 if(p>=lo&&p<=hi){s=0.6+c.pw*0.04;label='퍼펙트 킥!'}
 else if(p>hi){const o=(p-hi)/(1-hi);s=0.7+c.pw*0.03;sig+=o*0.06;dv=o*(0.22+0.35*Math.random());label='너무 세다!'}
 else{const o=(lo-p)/lo;s=Math.max(0.35,0.75-o*0.5)+c.pw*0.01;dv=-o*0.35;sig+=o*0.03;label=o>0.5?'너무 약해!':'조금 약해!'}
 s=Math.min(1,s);
 const u=au+gauss()*sig,v=Math.max(0.03,av+dv+gauss()*sig*1.2);
 return {kick:[r3(u),r3(v),r3(s)],label};
}

const DIFF={
 easy:{label:'쉬움',err:0.2,read:0,corner:0.2,note:'😊 컴퓨터가 가운데 쪽으로 차고, 파워 실수도 많아요.'},
 normal:{label:'보통',err:0.1,read:0.35,corner:0.5,note:'⚽ 적당히 구석을 노리고, 가끔 내 버릇을 읽어요.'},
 hard:{label:'어려움',err:0.045,read:0.6,corner:0.8,note:'🔥 구석을 정확히 노리고, 내가 자주 차는 방향을 기억해요!'}
};
const pickRand=a=>a[Math.floor(Math.random()*a.length)];
function cpuKick(c){
 const d=DIFF[S.diff]||DIFF.normal;
 let au,av;
 if(Math.random()<d.corner){au=Math.random()<0.5?0.08+Math.random()*0.14:0.78+Math.random()*0.14;av=Math.random()<0.5?0.15+Math.random()*0.2:0.6+Math.random()*0.25}
 else{au=0.3+Math.random()*0.4;av=0.15+Math.random()*0.6}
 const p=clamp(0.75+gauss()*d.err,0,1);
 return computeKick(c,au,av,p).kick;
}
function cpuDive(G,k){
 const d=DIFF[S.diff]||DIFF.normal;
 // 사람의 지난 킥 방향만 참고 (이번 킥은 보지 않음)
 const hist=G.p[0].kicks.slice(0,k).filter(Boolean);
 let u,v=0.2+Math.random()*0.6;
 if(hist.length>=2&&Math.random()<d.read){
  const cnt=[0,0,0];hist.forEach(h=>cnt[h[0]<0.38?0:h[0]>0.62?2:1]++);
  let r=Math.random()*hist.length,side=0;while(r>=cnt[side]&&side<2){r-=cnt[side];side++}
  u=[0.18,0.5,0.82][side]+(Math.random()-0.5)*0.12;
  const hv=hist.filter(h=>(h[0]<0.38?0:h[0]>0.62?2:1)===side).map(h=>h[1]);
  if(hv.length)v=clamp(hv.reduce((a,b)=>a+b,0)/hv.length+(Math.random()-0.5)*0.2,0.1,0.9);
 }else if(S.diff==='easy'&&Math.random()<0.3){u=0.5;v=0.5}
 else u=0.1+Math.random()*0.8;
 return [r3(u),r3(v)];
}
function cpuMove(G,t,need){
 const key=t+':'+need;if(S.cpuPending===key)return;S.cpuPending=key;
 const p=$('#panel');if(p)p.innerHTML=`<div class="wait">🤖 컴퓨터가 ${need==='kick'?'조준하는':'방향을 고르는'} 중…</div>`;
 setTimeout(()=>{
  if(S.screen!=='play'||S.cpuPending!==key)return;
  const {ki,k}=turnInfo(t);
  const val=need==='kick'?cpuKick(KMAP[G.p[ki].kicker]):cpuDive(G,k);
  submit(need,t,val);
 },700+Math.random()*700);
}

/* 두 폰을 인터넷으로 직접 연결 (WebRTC · PeerJS 무료 중계서버로 서로를 찾음) */
const PEER_PREFIX='pkduel-yj26-';
function peerRoom(code,role){
 return new Promise((resolve,reject)=>{
  const hostId=PEER_PREFIX+code;let me={},opp=null,upd=0,conn=null,closed=false,settled=false;
  const ph=[],ch=[];const fireP=()=>ph.forEach(h=>{try{h()}catch(e){}});const fireC=v=>ch.forEach(h=>{try{h(v)}catch(e){}});
  const send=()=>{if(conn&&conn.open){try{conn.send(JSON.stringify({pk:me}))}catch(e){}}};
  let peer;
  function attach(c){
   if(conn&&conn!==c){try{conn.close()}catch(e){}}
   conn=c;
   c.on('open',()=>{if(conn===c){fireC(true);send()}});
   c.on('data',d=>{try{const o=typeof d==='string'?JSON.parse(d):d;if(o&&o.pk&&typeof o.pk==='object'){opp=o.pk;upd=Date.now();fireP()}}catch(e){}});
   c.on('close',()=>{if(conn===c){conn=null;opp=null;fireP();fireC(false);if(role==='guest'&&!closed)setTimeout(dial,2500)}});
   c.on('error',()=>{});
  }
  function dial(){
   if(closed||!peer||peer.destroyed)return;
   if(peer.disconnected){try{peer.reconnect()}catch(e){}setTimeout(dial,2000);return}
   if(conn&&conn.open)return;
   attach(peer.connect(hostId,{reliable:true,serialization:'json'}));
  }
  try{peer=role==='host'?new Peer(hostId,{debug:0}):new Peer({debug:0})}catch(e){reject({code:'no-peer'});return}
  peer.on('open',()=>{if(role==='guest')dial();if(!settled){settled=true;resolve(api)}});
  peer.on('connection',c=>{if(role==='host')attach(c)});
  peer.on('disconnected',()=>{if(!closed)setTimeout(()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}},2000)});
  peer.on('error',e=>{const t=e&&e.type;
   if(!settled){settled=true;try{peer.destroy()}catch(x){}reject({code:t||'error'});return}
   if(t==='peer-unavailable'&&role==='guest'&&!closed){fireC(false);setTimeout(dial,3000)}
  });
  const hb=setInterval(send,3000);
  const api={
   presence:async p=>{if(p&&p.pk)me=JSON.parse(JSON.stringify(p.pk));send()},
   peers:()=>opp?[{peer:'opp',sameTab:false,isMe:false,kind:'viewer',guest:false,presence:{pk:opp},updatedAt:upd}]:[],
   onPeers:h=>{ph.push(h);setTimeout(()=>h({}),0);return()=>{}},
   onConnection:h=>{ch.push(h);setTimeout(()=>h(!!(conn&&conn.open)),0);return()=>{}},
   connected:()=>!!(conn&&conn.open),
   leave:async()=>{closed=true;clearInterval(hb);try{peer.destroy()}catch(e){}}
  };
 });
}
const roomP=new Promise(res=>{let n=0;const iv=setInterval(()=>{if(typeof window.Peer==='function'){clearInterval(iv);res({peer:true})}else if(++n>60){clearInterval(iv);res(null)}},200)});

async function enterRoom(code,role,resumeMe){
 if(!S.room){toast('온라인 연결을 쓸 수 없어요');return}
 if(S.nroom){try{await S.nroom.leave()}catch(e){}S.nroom=null}
 S.mode='online';S.code=code;S.role=role;
 S.me=resumeMe||{role,name:S.name||'나',kicker:'dash',keeper:'moon',ready:false,cfg:5,g:0,kicks:[],dives:[]};
 S.me.role=role;
 toast('연결 중…');
 let tries=0;
 while(true){
  try{S.nroom=await peerRoom(code,role);break}
  catch(e){
   if(role==='host'&&e&&e.code==='unavailable-id'&&!resumeMe&&tries++<5){code=String(Math.floor(1000+Math.random()*9000));S.code=code;continue}
   const why=e&&e.code==='unavailable-id'?'이전 방이 아직 닫히는 중이에요. 잠시 후 다시 시도하세요':'인터넷 연결을 확인해 주세요';
   toast('연결 실패: '+why);S.mode=null;S.nroom=null;return}
 }
 S.nroom.onPeers(()=>onRoom());
 S.nroom.onConnection(c=>{S.conn=c;const el=$('#conn');if(el){el.textContent=c?'● 상대와 연결됨':'○ 상대 연결 대기 중…';el.className='conn'+(c?'':' off')}});
 pushMe();S.screen='lobby';render();
}
function findOpp(){

 if(!ps.length)return null;
 ps.sort((a,b)=>b.updatedAt-a.updatedAt);
 return ps[0].presence.pk;
}

/* ================= 애니메이션 ================= */
const ease=x=>1-Math.pow(1-x,3);
function keeperPose(hx,hy){
 const th=clamp((hx-180)/120,-1,1)*78*Math.PI/180;
 let fx=hx-HAND*Math.sin(th),fy=hy+HAND*Math.cos(th);
 if(fy>200)fy=200;
 return {x:fx,y:fy,a:th*180/Math.PI};
}
function playAnim(G,t,r){
 S.anim=true;
 const {ki,gi,k}=turnInfo(t);const [u,v,s]=G.p[ki].kicks[k],[du,dv]=G.p[gi].dives[k];
 const tgt=toScr(u,v),hand=toScr(du,dv),pose=keeperPose(hand.x,hand.y);
 const kick=$('#kicker'),ball=$('#ball'),sh=$('#ballsh'),kp=$('#keeper'),bt=$('#bigtxt');
 $('#panel').innerHTML=`<div class="wait">👀 두근두근…</div>`;
 const runT=520,fly=1000*(1.0-0.5*s),post=1100;
 // 막혔을 때 튕겨나가는 지점
 const dir=tgt.x>=180?1:-1;
 const defl={x:tgt.x+dir*60,y:Math.min(260,tgt.y+70)};
 const t0=performance.now();let kicked=false,ended=false;
 function frame(now){
  if(S.screen!=='play')return;
  const e=now-t0;
  if(e<runT){const q=e/runT;kick.setAttribute('transform',`translate(${130+q*32} ${462-q*26})`);}
  else{
   if(!kicked){kicked=true;sfx.kick();}
   const q=Math.min(1,(e-runT)/fly);
   // 키퍼: 살짝 늦게 반응
   const kq=ease(clamp((q-0.08)/0.8,0,1));
   kp.setAttribute('transform',`translate(${180+(pose.x-180)*kq} ${200+(pose.y-200)*kq}) rotate(${pose.a*kq})`);
   let bx,by,sc;
   if(q<1){const qq=ease(q*0.9+0.1*q*q);
    bx=SPOT.x+(tgt.x-SPOT.x)*qq;by=SPOT.y+(tgt.y-SPOT.y)*qq-Math.sin(Math.PI*q)*(18+(1-s)*30);sc=1-0.45*qq;
    if(r.type==='save'&&q>0.82){/* 손에 걸림 */}
   }else{
    const pq=clamp((e-runT-fly)/500,0,1);
    if(r.type==='save'){bx=tgt.x+(defl.x-tgt.x)*pq;by=tgt.y+(defl.y-tgt.y)*pq-Math.sin(Math.PI*pq)*25;sc=.55+.2*pq}
    else if(r.type==='goal'){bx=tgt.x+(tgt.x-180)*0.04*pq;by=tgt.y+(GY-6-tgt.y)*ease(pq)*0.9;sc=.55-.05*pq}
    else if(r.type==='post'){bx=tgt.x-dir*40*pq;by=tgt.y+60*pq;sc=.55+.1*pq}
    else{bx=tgt.x+(tgt.x-180)*0.25*pq;by=tgt.y-40*pq;sc=.55-.25*pq}
    if(!ended){ended=true;showResult(r,G,ki)}
   }
   ball.setAttribute('transform',`translate(${bx} ${by}) scale(${sc}) rotate(${e*0.8})`);
   const gy=q<1?SPOT.y+5+(Math.max(GY,tgt.y)+2-SPOT.y-5)*ease(q):Math.max(GY+2,by+4);
   sh.setAttribute('transform',`translate(${bx} ${gy}) scale(${sc})`);
  }
  if(e<runT+fly+post+400)requestAnimationFrame(frame);
  else{S.anim=false;S.shown=t+1;advance();}
 }
 requestAnimationFrame(frame);
 function showResult(r,G,ki){
  const txt={goal:'골~~!! ⚽',save:'선방!! 🧤',miss:'빗나갔다!',post:'골대 강타!'}[r.type];
  bt.textContent=txt;bt.setAttribute('fill',r.type==='goal'?'#ffd43b':r.type==='save'?'#74c0fc':'#ff8787');bt.setAttribute('opacity',1);
  if(r.type==='goal'){sfx.goal();buzz([80,40,160])}else if(r.type==='save'){sfx.save();buzz(120)}else{sfx.miss();buzz(60)}
  const mi=S.mode==='online'?myIdx():S.cpu?0:-1;
  const mine=mi>=0?(ki===mi?(r.type==='goal'?'내 슛 성공!':'아깝다… 내 슛이 막혔어'):(r.type==='goal'?'실점… 다음엔 막자!':'막아냈다! 👏')):'';
  $('#panel').innerHTML=`<div class="wait" style="font-size:20px;font-weight:900;color:var(--txt)">${txt}<br><span class="note">${mine}</span></div>`;
  updBoard(G,t+1);
 }
}

  case 'gojoin':if(!S.name){toast('이름을 먼저 적어주세요');$('#nm')&&$('#nm').focus();return}S.screen='join';render();break;
  case 'join':{const c=($('#code').value||'').replace(/\D/g,'');if(c.length!==4){toast('4자리 번호를 입력하세요');return}enterRoom(c,'guest');break}
  case 'resume':{try{const s=JSON.parse(LS.get('pk-sess'));if(S.name)s.me.name=S.name;enterRoom(s.code,s.role,s.me)}catch(err){toast('이어할 경기가 없어요')}break}
  case 'cfg':S.me.cfg=+el.dataset.n;pushMe();updLobby();break;
  case 'pick':{const {who,kind,id}=el.dataset;
   if(who==='me'){if(kind==='k')S.me.kicker=id;else S.me.keeper=id;pushMe()}
   else{const p=S.L.p[+who];if(kind==='k')p.kicker=id;else p.keeper=id}
   el.parentNode.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',c===el));break}
  case 'ready':S.me.ready=!S.me.ready;S.me.name=S.name||S.me.name;pushMe();onRoom();break;
  case 'quit':{leaveRoom();LS.del('pk-sess');closeOvl();S.screen='home';S.mode=null;S.cpu=false;render();break}
  case 'cpu':S.mode='local';S.cpu=true;S.L={kicks:5,p:[{name:S.name||'나',kicker:'haru',keeper:'moon',kicks:[],dives:[]},{name:'컴퓨터',kicker:pickRand(KICKERS).id,keeper:pickRand(KEEPERS).id,kicks:[],dives:[]}]};S.screen='localSetup';render();break;
  case 'diff':S.diff=el.dataset.d;LS.set('pk-diff',S.diff);el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));$('#diffNote').textContent=DIFF[S.diff].note;break;
  case 'cpureroll':S.L.p[1].kicker=pickRand(KICKERS).id;S.L.p[1].keeper=pickRand(KEEPERS).id;render();break;
  case 'local':S.cpu=false;S.mode='local';S.L={kicks:5,p:[{name:S.name||'아빠',kicker:'haru',keeper:'moon',kicks:[],dives:[]},{name:'아들',kicker:'dash',keeper:'cat',kicks:[],dives:[]}]};S.screen='localSetup';render();break;
  case 'lcfg':S.L.kicks=+el.dataset.n;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break;
  case 'lstart':S.L.p.forEach(p=>{p.kicks=[];p.dives=[]});S.holder=-1;S.cpuPending=null;startPlay();break;
  case 'takeover':S.holder=+el.dataset.who;closeOvl();advance();break;
  case 'shoot':doShoot(false);break;
  case 'dive':doDive(false);break;
  case 'stay':S.inp&&(S.inp.aim={u:0.5,v:0.5});doDive(false);break;
  case 'rematch':
   if(S.mode==='local'){S.screen='localSetup';render()}
   else{S.me.g=(S.me.g||0)+1;S.me.kicks=[];S.me.dives=[];S.me.ready=false;pushMe();S.screen='lobby';render()}
   break;
 }
});
render();
</script>
</body>
</html>
